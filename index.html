<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>মেসার্স ভাই ভাই ভুসি ও গো-খাদ্য ভাণ্ডার</title>
    <meta name="description" content="অনলাইন গো-খাদ্য স্টোর এবং প্রফেশনাল একাউন্টিং ও লেজার ম্যানেজমেন্ট সিস্টেম" />
    <meta property="og:title" content="মেসার্স ভাই ভাই ভুসি ও গো-খাদ্য ভাণ্ডার" />
    <meta property="og:description" content="অনলাইন গো-খাদ্য স্টোর এবং প্রফেশনাল একাউন্টিং ও লেজার ম্যানেজমেন্ট সিস্টেম" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body class="font-sans antialiased text-slate-800 bg-slate-50 selection:bg-emerald-600 selection:text-white">
    <div id="root">
      <div id="app-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; font-family: 'Hind Siliguri', sans-serif; text-align: center; padding: 20px;">
        <div style="width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top-color: #059669; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <h2 style="margin-top: 16px; font-size: 19px; font-weight: 700; color: #0f172a;">মেসার্স ভাই ভাই ভুসি ও গো-খাদ্য ভাণ্ডার</h2>
        <p style="margin-top: 6px; font-size: 13px; color: #64748b;">লোড হচ্ছে, অনুগ্রহ করে একটু অপেক্ষা করুন...</p>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>

    <!-- Universal Bootstrapper: Works both in Vite dev server and when downloaded for static/cPanel/Apache hosting -->
    <script>
      (function() {
        var staticLoaded = false;
        function loadStaticBundle() {
          if (staticLoaded || window.__APP_INITIALIZED__) return;
          staticLoaded = true;

          // Inject compiled stylesheet if needed
          if (!document.getElementById('app-static-css')) {
            var css = document.createElement('link');
            css.id = 'app-static-css';
            css.rel = 'stylesheet';
            css.href = './assets/app.css?v=' + Date.now();
            document.head.appendChild(css);
          }

          // Inject compiled JS bundle
          var script = document.createElement('script');
          script.type = 'module';
          script.src = './assets/app.js?v=' + Date.now();
          script.onerror = function() {
            var fallback = document.createElement('script');
            fallback.type = 'module';
            fallback.src = '/assets/app.js?v=' + Date.now();
            document.body.appendChild(fallback);
          };
          document.body.appendChild(script);
        }

        window.__loadStaticBundle = loadStaticBundle;

        // Detect if running under Vite dev server
        var isViteDev = window.location.port === '3000' || window.location.hostname.includes('run.app');
        if (!isViteDev) {
          // Downloaded files or cPanel / Apache / static hosting: load bundle immediately!
          loadStaticBundle();
        }

        // Safety fallback: if Vite fails or takes > 1.5s, trigger static bundle
        setTimeout(function() {
          if (!window.__APP_INITIALIZED__) {
            loadStaticBundle();
          }
        }, 1500);

        // Long timeout handler: Show friendly Bengali reload card if page cannot load after 6 seconds
        setTimeout(function() {
          if (!window.__APP_INITIALIZED__) {
            var loader = document.getElementById('app-loader');
            if (loader) {
              loader.innerHTML = '<div style="background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:24px 20px;max-width:380px;margin:0 auto;box-shadow:0 10px 25px -5px rgba(0,0,0,0.08);text-align:center;">' +
                '<div style="width:48px;height:48px;background:#fef2f2;color:#dc2626;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px;border:1px solid #fee2e2;">⚠️</div>' +
                '<h3 style="font-weight:700;color:#0f172a;font-size:16px;margin:0 0 6px;">পেজ লোড হতে বিলম্ব হচ্ছে</h3>' +
                '<p style="font-size:12px;color:#64748b;margin:0 0 16px;line-height:1.5;">ইন্টারনেট সংযোগ বা ক্যাশের কারণে ডেটা লোড হতে বিলম্ব হতে পারে। নিচের বাটনে চাপ দিয়ে রিলোড করুন।</p>' +
                '<button onclick="window.location.reload(true)" style="background:#059669;color:#ffffff;border:none;padding:10px 22px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 2px 4px rgba(5,150,105,0.2);">' +
                '🔄 পুনরায় চেষ্টা করুন (Reload)' +
                '</button>' +
                '</div>';
            }
          }
        }, 6000);
      })();
    </script>

    <!-- Vite Dev Entrypoint (Runs in Vite dev server; triggers static bundle on failure) -->
    <script type="module" src="/src/main.tsx" onerror="window.__loadStaticBundle && window.__loadStaticBundle()"></script>
  </body>
</html>
